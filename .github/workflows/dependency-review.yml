name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails the PR when it introduces a dependency with a known advisory or a
      # license outside the allowlist.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Copyleft licenses are denied rather than the permissive set being
          # allowed, so an unrecognised-but-permissive license does not block a
          # PR that nobody has configured for it yet.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
          # sharp's prebuilt libvips binaries are LGPL-3.0-or-later, dynamically
          # linked and unmodified, which LGPL permits; the deny stays for the rest.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64
          # No `comment-summary-in-pr`: it needs `pull-requests: write`, which a
          # fork PR's token does not have. The job log is the report.
